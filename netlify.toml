# Netlify: static front-end only. Backend features (news gossip, stats, chat, admin) call the Cloudflare Worker.
# Before deploying, set window.ARK_API in site/index.html AND site/admin.html to your Worker URL, e.g.
#   window.ARK_API="https://noahs-ark-retruns.<your-subdomain>.workers.dev";
# and add your Netlify URL to ALLOWED_ORIGINS in worker/wrangler.toml, then redeploy the Worker.
[build]
  publish = "site"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
