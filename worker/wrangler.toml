# Cloudflare Worker (backend API + static site). Deploy with: npx wrangler deploy
name = "noahs-ark-retruns"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "ark-analytics"
database_id = "PASTE_ID_FROM_wrangler_d1_create"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# ntfy.sh topic for phone push (pick a long random name and keep it private). Empty = push disabled.
NTFY_TOPIC = ""
DASH_URL = "https://noahs-ark-retruns.fastbitcoin12.workers.dev/"
# Sites allowed to call the API (the admin uses a bearer token, not cookies).
ALLOWED_ORIGINS = "*"

# Secret (never commit): npx wrangler secret put ADMIN_PASSWORD_HASH
# Value = SHA-256 hex of your admin password.
