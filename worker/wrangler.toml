name = "noahs-ark-retruns"
main = "src/index.js"
compatibility_date = "2024-11-01"

# The static site is served by the same Worker; only /api/* runs code first.
[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Create with: npx wrangler d1 create ark-analytics   then paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "ark-analytics"
database_id = "6a11e504-ecc2-4154-86eb-328fef35ebc7"

# Checks NWS for new critical alerts every 5 minutes and pushes them through ntfy.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Sites allowed to call this API (comma separated).
ALLOWED_ORIGINS = "https://noahs-ark-retruns.netlify.app"
DASH_URL = "https://noahs-ark-retruns.netlify.app"

# Secrets (never put these in a file or in GitHub). Set each with: npx wrangler secret put NAME
#   ADMIN_PASSWORD_HASH  = SHA-256 hex of the admin password
#   NTFY_TOPIC           = long random topic name for push alerts
